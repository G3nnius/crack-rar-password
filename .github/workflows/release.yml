name: release

# Build self-contained binaries for every target and attach them to the
# GitHub release when a version tag (v*) is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload to (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure a release exists for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "RARNinja $TAG" \
            --notes "Self-contained builds. macOS: the .app (GUI) + CLI. Linux: GUI binary + CLI (x64 and arm64). Backends bundled (unrar on macOS, static 7zz on Linux). Linux GUI: chmod +x then run (needs a desktop/X11). First macOS launch: right-click -> Open (unsigned)."

  macos-arm64:
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Test
        run: |
          chmod +x bin/macos-arm64/unrar bin/macos-arm64/rar
          python tests/test_rarninja.py
      - name: Build app + CLI
        run: |
          pyinstaller --onefile --name rarninja --distpath dist/cli \
            --target-arch arm64 --optimize 2 --strip \
            --add-binary "bin/macos-arm64/unrar:bin/macos-arm64" --console RARNinja.py
          pyinstaller --windowed --name RARNinja --distpath dist/app \
            --target-arch arm64 --optimize 2 --icon assets/RARNinja.icns \
            --add-binary "bin/macos-arm64/unrar:bin/macos-arm64" \
            --add-data "assets/icon_1024.png:assets" gui.py
          ditto -c -k --keepParent dist/app/RARNinja.app RARNinja-macos-arm64.zip
          mv dist/cli/rarninja rarninja-macos-arm64
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" RARNinja-macos-arm64.zip rarninja-macos-arm64 --repo "$GITHUB_REPOSITORY" --clobber

  linux-x64:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Test
        run: |
          chmod +x bin/linux-x64/7zz
          python tests/test_rarninja.py
      - name: Build CLI
        run: |
          pyinstaller --onefile --name rarninja --optimize 2 --strip \
            --add-binary "bin/linux-x64/7zz:bin/linux-x64" --console RARNinja.py
          mv dist/rarninja rarninja-linux-x64
      - name: Build GUI (Ubuntu container, verified under xvfb)
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src ubuntu:22.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python3-tk \
              binutils file xvfb libx11-6 libxext6 libxrender1 libxft2 ca-certificates
            pip3 install --no-cache-dir pyinstaller
            chmod +x bin/linux-x64/7zz
            python3 -c "import tkinter; print(\"tk\", tkinter.TkVersion)"
            pyinstaller --onefile --name rarninja-gui --optimize 2 --strip \
              --add-binary "bin/linux-x64/7zz:bin/linux-x64" \
              --add-data "assets/icon_1024.png:assets" gui.py
            xvfb-run -a ./dist/rarninja-gui --selftest tests/fixtures/locked.rar tests/fixtures/words.txt
            mv dist/rarninja-gui /src/rarninja-gui-linux-x64
          '
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" rarninja-linux-x64 rarninja-gui-linux-x64 \
            --repo "$GITHUB_REPOSITORY" --clobber

  linux-arm64:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - name: Build CLI + GUI (arm64 Ubuntu container via QEMU, GUI verified under xvfb)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src ubuntu:22.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python3-tk \
              binutils file xvfb libx11-6 libxext6 libxrender1 libxft2 ca-certificates
            pip3 install --no-cache-dir pyinstaller
            chmod +x bin/linux-arm64/7zz
            python3 -c "import tkinter; print(\"tk\", tkinter.TkVersion)"
            python3 tests/test_rarninja.py
            pyinstaller --onefile --name rarninja --optimize 2 --strip \
              --add-binary "bin/linux-arm64/7zz:bin/linux-arm64" --console RARNinja.py
            mv dist/rarninja /src/rarninja-linux-arm64
            pyinstaller --onefile --name rarninja-gui --optimize 2 --strip \
              --add-binary "bin/linux-arm64/7zz:bin/linux-arm64" \
              --add-data "assets/icon_1024.png:assets" gui.py
            xvfb-run -a ./dist/rarninja-gui --selftest tests/fixtures/locked.rar tests/fixtures/words.txt
            mv dist/rarninja-gui /src/rarninja-gui-linux-arm64
          '
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" rarninja-linux-arm64 rarninja-gui-linux-arm64 \
            --repo "$GITHUB_REPOSITORY" --clobber
